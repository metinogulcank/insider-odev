<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Öğrenci Listesi</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
  <h1>Öğrenci Listesi</h1>

  <form id="studentForm">
    <label for="nameInput">Öğrenci Adı:</label>
    <input type="text" id="nameInput" placeholder="Öğrenci Adı" required>
    <label for="classInput">Sınıf:</label>
    <input type="text" id="classInput" placeholder="Sınıf" required>
    <button type="submit">Ekle</button>
  </form>

  <table id="studentTable">
    <thead>
      <tr>
        <th>Ad</th>
        <th>Sınıf</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
